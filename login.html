<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Exam Proctoring - Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: #fff;
        padding: 25px 30px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 15px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        padding: 10px;
        background: #0066cc;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background: #004c99;
      }
      .switch-link {
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
      }
      .switch-link a {
        color: #0066cc;
        text-decoration: none;
      }
      .switch-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container" id="auth-box">
      <!-- Login Form -->
      <div id="login-form">
        <h2>Login</h2>
        <form action="login.php" method="POST">
          <input type="email" name="email" placeholder="Enter Email" required />
          <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
          />
          <button type="submit">Login</button>
        </form>
        <div class="switch-link">
          New here? <a href="#" onclick="toggleForm('register')">Register</a>
        </div>
      </div>

      <!-- Register Form -->
      <div id="register-form" style="display: none">
        <h2>Register</h2>
        <form action="register.php" method="POST">
          <input type="text" name="name" placeholder="Full Name" required />
          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
          />
          <div style="display: flex; align-items: center">
            <input
              type="text"
              value="+91"
              readonly
              style="
                width: 40px;
                margin-right: 5px;
                text-align: center;
                background: #f0f0f0;
                border: 1px solid #ccc;
              "
              tabindex="-1"
            />
            <input
              type="text"
              name="phone"
              maxlength="10"
              pattern="[0-9]{10}"
              required
              title="Please enter exactly 10 digits"
              placeholder="10-digit Mobile Number"
              style="width: 150px"
            />
          </div>
          <!-- Continue with your other fields... -->

          <!-- inside Register form -->
          <select name="role" required>
            <option value="student" selected>Register as Student</option>
            <option value="admin">Register as Admin</option></select
          ><br />

          <input
            type="password"
            name="password"
            placeholder="Create Password"
            required
          />
          <button type="submit">Register</button>
        </form>
        <div class="switch-link">
          Already have an account?
          <a href="#" onclick="toggleForm('login')">Login</a>
        </div>
      </div>
    </div>

    <script>
      function toggleForm(formType) {
        document.getElementById("login-form").style.display =
          formType === "login" ? "block" : "none";
        document.getElementById("register-form").style.display =
          formType === "register" ? "block" : "none";
      }
    </script>
  </body>
</html>
